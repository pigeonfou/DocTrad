name: DocTrad reference automation
on:
  push:
    branches: [main]
    paths: ['.github/doctrad-automation.json']
  workflow_dispatch:
    inputs:
      operation:
        type: choice
        options: [probe, latest, run, status]
        default: probe
        description: Public reference operation
permissions:
  contents: read
concurrency:
  group: doctrad-server-operations
  cancel-in-progress: false
jobs:
  reference:
    if: github.repository == 'pigeonfou/DocTrad' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, Linux, X64, doctrad-deploy]
    timeout-minutes: 30
    steps:
      - name: Resolve bounded operation
        id: request
        uses: actions/github-script@v7
        with:
          script: |
            let operation = context.payload.inputs?.operation;
            if (context.eventName === 'push') {
              const file = await github.rest.repos.getContent({
                ...context.repo, path: '.github/doctrad-automation.json', ref: context.sha
              });
              operation = JSON.parse(Buffer.from(file.data.content, 'base64').toString()).operation;
            }
            if (!['probe', 'latest', 'run', 'status'].includes(operation)) {
              throw new Error('Unsupported reference operation');
            }
            core.setOutput('operation', operation);
      - name: Execute reference operation
        id: evidence
        env:
          OPERATION: ${{ steps.request.outputs.operation }}
        shell: bash
        run: |
          set -euo pipefail
          helper=/usr/local/sbin/oneforall-doctrad-deploy
          sudo -n "$helper" --automation-probe
          echo 'ready=true' >> "$GITHUB_OUTPUT"
          case "$OPERATION" in
            probe) ;;
            latest)
              sudo -n "$helper" --test-latest
              python3 -c 'import json; assert json.load(open("/var/lib/oneforall/doctrad-automation/manifest.json"))["status"] == "done"'
              ;;
            status) sudo -n "$helper" --test-status ;;
            run)
              sudo -n "$helper" --test-start
              for attempt in $(seq 1 150); do
                sudo -n "$helper" --test-status
                state=$(python3 -c 'import json; print(json.load(open("/var/lib/oneforall/doctrad-automation/manifest.json"))["status"])')
                case "$state" in
                  done) break ;;
                  failed|missing_output) echo "Reference translation failed; see diagnostic artifact."; exit 1 ;;
                  queued|running|export_queued|exporting) sleep 10 ;;
                  *) echo "Unexpected reference job state."; exit 1 ;;
                esac
              done
              [[ "$state" == done ]] || { echo 'Reference job timed out; status can be retrieved later.'; exit 1; }
              ;;
            *) exit 1 ;;
          esac
      - name: Retrieve public reference evidence
        if: always() && steps.evidence.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: doctrad-reference-${{ github.run_id }}
          path: |
            /var/lib/oneforall/doctrad-automation/manifest.json
            /var/lib/oneforall/doctrad-automation/source.pdf
            /var/lib/oneforall/doctrad-automation/translation.pdf
            /var/lib/oneforall/doctrad-automation/segments.json
            /var/lib/oneforall/doctrad-automation/diagnostics.json
            /var/lib/oneforall/doctrad-automation/layout-report.json
          retention-days: 1
          if-no-files-found: warn
