name: DocTrad reference automation
on:
  push:
    branches: [main, refonte-contexte-mise-en-page]
    paths: ['.github/doctrad-automation.json']
  workflow_dispatch:
    inputs:
      operation:
        type: choice
        options: [probe, latest, run, run-l3, run-tsm, status]
        default: probe
        description: Public reference operation
permissions:
  contents: read
concurrency:
  group: doctrad-server-operations
  cancel-in-progress: false
jobs:
  reference:
    if: github.repository == 'pigeonfou/DocTrad' && contains(fromJSON('["refs/heads/main","refs/heads/refonte-contexte-mise-en-page"]'), github.ref)
    runs-on: [self-hosted, Linux, X64, doctrad-deploy]
    timeout-minutes: 30
    steps:
      - name: Resolve bounded operation
        id: request
        uses: actions/github-script@v7
        with:
          script: |
            let operation = context.payload.inputs?.operation;
            if (context.eventName === 'push') {
              const file = await github.rest.repos.getContent({
                ...context.repo, path: '.github/doctrad-automation.json', ref: context.sha
              });
              operation = JSON.parse(Buffer.from(file.data.content, 'base64').toString()).operation;
            }
            if (!['probe', 'latest', 'run', 'run-l3', 'run-tsm', 'status'].includes(operation)) {
              throw new Error('Unsupported reference operation');
            }
            core.setOutput('operation', operation);
      - name: Execute reference operation
        id: evidence
        env:
          OPERATION: ${{ steps.request.outputs.operation }}
        shell: bash
        run: |
          set -euo pipefail
          helper=/usr/local/sbin/oneforall-doctrad-deploy
          sudo -n "$helper" --automation-probe
          echo 'ready=true' >> "$GITHUB_OUTPUT"
          case "$OPERATION" in
            probe) ;;
            latest)
              sudo -n "$helper" --test-latest
              python3 -c 'import json; assert json.load(open("/var/lib/oneforall/doctrad-automation/manifest.json"))["status"] == "done"'
              ;;
            status) sudo -n "$helper" --test-status ;;
            run|run-l3|run-tsm)
              if [[ "$OPERATION" == run-tsm ]]; then
                sudo -n "$helper" --test-start-tsm
              elif [[ "$OPERATION" == run-l3 ]]; then
                sudo -n "$helper" --test-start-l3
              else
                sudo -n "$helper" --test-start
              fi
              for attempt in $(seq 1 150); do
                sudo -n "$helper" --test-status
                state=$(python3 -c 'import json; print(json.load(open("/var/lib/oneforall/doctrad-automation/manifest.json"))["status"])')
                case "$state" in
                  done) break ;;
                  failed|missing_output) echo "Reference translation failed; see diagnostic artifact."; exit 1 ;;
                  queued|running|export_queued|exporting) sleep 10 ;;
                  *) echo "Unexpected reference job state."; exit 1 ;;
                esac
              done
              [[ "$state" == done ]] || { echo 'Reference job timed out; status can be retrieved later.'; exit 1; }
              ;;
            *) exit 1 ;;
          esac
      - name: Inspect recognized public reference
        if: always() && steps.evidence.outputs.ready == 'true'
        shell: bash
        run: |
          /opt/oneforall/apps/doctrad/current/.venv/bin/python -I - <<'PY'
          import base64, collections, hashlib, io, json, os, subprocess, tempfile
          from pathlib import Path
          root=Path('/var/lib/oneforall/doctrad-automation')
          manifest=json.loads((root/'manifest.json').read_text())
          allowed={'cc6a5ca2bd9fad41fce19136afd7aaca3315a783a52348a4984bf11d8b8e41f6','9bc58a21ffa56f89dcec9e201f17d77b606135462a9c23b8e23fc274467b9e4b'}
          source=root/'source.pdf'
          if not source.exists():
              raise SystemExit(0)
          digest=hashlib.sha256(source.read_bytes()).hexdigest()
          assert digest in allowed and digest==manifest['source_sha256']
          report={'manifest':manifest,'deployed_sha':Path('/opt/oneforall/apps/doctrad/current').resolve().name}
          for name in ('segments.json','diagnostics.json','layout-report.json'):
              path=root/name
              if path.exists():report[name]=json.loads(path.read_text())
          print('DOCTRAD_PUBLIC_REPORT='+json.dumps(report,ensure_ascii=False))
          pdf=root/'translation.pdf'
          if manifest['status']=='done' and pdf.is_file():
              from pypdf import PdfReader
              text='\n'.join(page.extract_text() for page in PdfReader(pdf).pages)
              print('DOCTRAD_PUBLIC_TEXT='+json.dumps(text,ensure_ascii=False))
              from PIL import Image
              with tempfile.TemporaryDirectory(dir=os.environ.get('RUNNER_TEMP')) as temp:
                  prefix=str(Path(temp)/'page')
                  subprocess.run(['pdftoppm','-scale-to','1500','-png',str(pdf),prefix],check=True,capture_output=True)
                  for page in sorted(Path(temp).glob('page-*.png')):
                      output=io.BytesIO()
                      with Image.open(page) as image:image.convert('RGB').save(output,format='JPEG',quality=88)
                      print('DOCTRAD_PUBLIC_PREVIEW_'+page.stem+'='+base64.b64encode(output.getvalue()).decode())
          PY
      - name: Retrieve public reference evidence
        if: always() && steps.evidence.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: doctrad-reference-${{ github.run_id }}
          path: |
            /var/lib/oneforall/doctrad-automation/manifest.json
            /var/lib/oneforall/doctrad-automation/source.pdf
            /var/lib/oneforall/doctrad-automation/translation.pdf
            /var/lib/oneforall/doctrad-automation/segments.json
            /var/lib/oneforall/doctrad-automation/diagnostics.json
            /var/lib/oneforall/doctrad-automation/layout-report.json
          retention-days: 1
          if-no-files-found: warn
