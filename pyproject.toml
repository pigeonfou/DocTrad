[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"
[project]
name = "doctrad"
version = "0.1.0"
description = "Local technical document translation server"
requires-python = ">=3.12"
dependencies = ["fastapi", "uvicorn", "sqlalchemy", "psycopg[binary]", "python-multipart", "itsdangerous", "argon2-cffi", "httpx", "python-docx", "python-pptx", "pypdf", "reportlab", "Pillow", "jinja2"]
[project.optional-dependencies]
translation = ["torch", "transformers", "sentencepiece", "sacremoses", "safetensors", "huggingface-hub"]
test = ["pytest", "PyMuPDF==1.26.6"]
[project.scripts]
docutranslate = "app.cli:main"
[tool.setuptools.packages.find]
include = ["app*"]
[tool.setuptools.package-data]
app = ["templates/*.html", "static/*"]
[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

